services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: heywinmeneseshp/api-corban:latest
    container_name: api-corban
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1

      DB_HOST: banarica-mysql
      DB_PORT: 3306
      DB_NAME: banarica
      DB_USER: banarica_user
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 7d

      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      AUTO_MIGRATE: "true"

      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 10

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: noreply@banarica.cloud

    networks:
      - banarica-network
      - database-banarica_banarica-network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=banarica-network"

      - "traefik.http.routers.api-corbana.rule=Host(`api-corbana.banarica.cloud`)"
      - "traefik.http.routers.api-corbana.entrypoints=websecure"
      - "traefik.http.routers.api-corbana.tls=true"
      - "traefik.http.routers.api-corbana.tls.certresolver=letsencrypt"

      - "traefik.http.services.api-corbana.loadbalancer.server.port=3000"

  app-banarica:
    build:
      context: ../app-corbana
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* de Next.js se hornea en el JS del cliente en tiempo de
        # build, no se lee en runtime — la variable de entorno de abajo NO
        # alcanza para que el navegador le pegue a la URL correcta. Sin este
        # build-arg, la imagen queda con el fallback/valor viejo horneado y el
        # login falla con "Failed to fetch" (el navegador intenta conectar a
        # una API equivocada, no hay error de red real).
        NEXT_PUBLIC_API_URL: https://api-corbana.banarica.cloud/api/v1
    image: heywinmeneseshp/app-corbana:latest
    container_name: app-banarica
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://api-corbana.banarica.cloud/api/v1
    depends_on:
      - api
    networks:
      - banarica-network
      - database-banarica_banarica-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=banarica-network"
      - "traefik.http.routers.app-corbana.rule=Host(`banarica.cloud`) || Host(`www.banarica.cloud`)"
      - "traefik.http.routers.app-corbana.entrypoints=websecure"
      - "traefik.http.routers.app-corbana.tls=true"
      - "traefik.http.routers.app-corbana.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-corbana.loadbalancer.server.port=3001"

networks:

  banarica-network:
    external: true

  # Red donde quedó el contenedor de MySQL tras su último redeploy (creada
  # por su propio docker-compose bajo el nombre de proyecto
  # "database-banarica") — sin esto, la API no puede resolver
  # "banarica-mysql" por DNS de Docker.
  database-banarica_banarica-network:
    external: true
